name: Supabase Daily Database Backup

on:
  schedule:
    # Runs daily at 02:00 UTC (07:30 IST)
    - cron: '0 2 * * *'
  # Enables manual trigger button in GitHub Actions tab anytime
  workflow_dispatch:

jobs:
  backup:
    name: Backup Database
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Create Database Dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "❌ Error: SUPABASE_DB_URL repository secret is not set!"
            echo "Go to: GitHub Repo -> Settings -> Secrets and variables -> Actions -> Add 'SUPABASE_DB_URL'"
            exit 1
          fi

          mkdir -p backups
          TIMESTAMP=$(date +'%Y-%m-%d_%H%M%S')
          BACKUP_FILE="backups/dhikrly_supabase_${TIMESTAMP}.sql"

          export PGSSLMODE=require

          echo "⏳ Running pg_dump for public schema and auth users..."
          pg_dump "$SUPABASE_DB_URL" \
            --schema=public \
            --schema=auth \
            --clean \
            --if-exists \
            --no-owner \
            --no-privileges \
            -f "$BACKUP_FILE"

          echo "🗜️ Compressing backup file..."
          gzip -9 "$BACKUP_FILE"

          echo "✅ Backup created successfully:"
          ls -lh backups/

      - name: Upload Backup Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backups/*.sql.gz
          retention-days: 30
