<svg width="3840" height="2160" viewBox="0 0 3840 2160" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=EB+Garamond:ital,wght@0,400;0,500;1,400&amp;family=Inter:wght@400;500&amp;display=swap');

      .arabic { font-family: 'Amiri', 'Noto Naskh Arabic', serif; }
      .wordmark { font-family: 'EB Garamond', Georgia, serif; }
      .tagline { font-family: 'Inter', -apple-system, sans-serif; }
      .url { font-family: 'Inter', -apple-system, sans-serif; }
    </style>

    <radialGradient id="bgGlow" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#173930"/>
      <stop offset="55%" stop-color="#0F2620"/>
      <stop offset="100%" stop-color="#0A1916"/>
    </radialGradient>

    <linearGradient id="arcFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C6A15B" stop-opacity="0"/>
      <stop offset="12%" stop-color="#C6A15B" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#C6A15B" stop-opacity="0.85"/>
      <stop offset="88%" stop-color="#C6A15B" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#C6A15B" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="3840" height="2160" fill="url(#bgGlow)"/>

  <!-- the day's arc: five prayers, one moment marked -->
  <path d="M 660 1300 Q 1920 550 3180 1300" fill="none" stroke="url(#arcFade)" stroke-width="2.5"/>

  <!-- five prayer ticks along the arc -->
  <circle cx="1038" cy="1108.75" r="7" fill="#C6A15B" fill-opacity="0.45"/>
  <circle cx="1542" cy="958.75" r="7" fill="#C6A15B" fill-opacity="0.45"/>
  <circle cx="1920" cy="925" r="7" fill="#C6A15B" fill-opacity="0.45"/>
  <circle cx="2802" cy="1108.75" r="7" fill="#C6A15B" fill-opacity="0.45"/>

  <!-- the marked moment -->
  <circle cx="2298" cy="958.75" r="10" fill="#E8C77E" filter="url(#softGlow)"/>
  <circle cx="2298" cy="958.75" r="4" fill="#FCF3DE"/>

  <!-- Arabic wordmark -->
  <text x="1920" y="1560" text-anchor="middle" class="arabic" font-size="240" fill="#EFE7D8" font-weight="500">ذِكْرلي</text>

  <!-- divider -->
  <line x1="1830" y1="1622" x2="2010" y2="1622" stroke="#C6A15B" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Latin wordmark -->
  <text x="1920" y="1720" text-anchor="middle" class="wordmark" font-size="96" letter-spacing="6" fill="#EFE7D8" font-style="italic">Dhikrly</text>

  <!-- tagline -->
  <text x="1920" y="1810" text-anchor="middle" class="tagline" font-size="34" letter-spacing="1" fill="#8FA79C">Adhkār, Duʿā, and Ṣalāh — tracked, and remembered on time</text>

  <!-- site mark -->
  <text x="3640" y="2060" text-anchor="end" class="url" font-size="30" fill="#5F776E">dhikrly.com</text>
</svg>
