<svg width="320" height="88" viewBox="0 0 320 88" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#1B4238"/>
      <stop offset="100%" stop-color="#0D211D"/>
    </radialGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- mark -->
  <g transform="translate(0,4)">
    <rect width="80" height="80" rx="18" fill="url(#bg)"/>
    <path d="M 14 53 Q 40 20 66 53" fill="none" stroke="#C6A15B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="50.4" cy="39.3" r="5" fill="#E8C77E" filter="url(#glow)"/>
    <circle cx="50.4" cy="39.3" r="1.8" fill="#FCF3DE"/>
  </g>

  <!-- wordmark -->
  <text x="98" y="58" font-family="'EB Garamond', Georgia, serif" font-style="italic" font-size="46" letter-spacing="1" fill="#1C2A26">Dhikrly</text>
</svg>
